name: market-prices

on:
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # required to commit data back to the repo

env:
  TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
  DATA_DIR: docs/data
  PUBLIC_MODE: '1'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch prices
        run: python fetch_prices.py

      # Must run after fetch_prices: it reads prices_latest.json to work out
      # the street-vs-CBM spread.
      - name: Fetch market data
        run: python fetch_market.py

      # Same script as the one-off backfill, but only two pages deep. Merges
      # today's readings into series.json without re-walking the archive.
      - name: Update series
        env:
          TG_PAGES: '2'
        run: python backfill_history.py

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet && exit 0
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
