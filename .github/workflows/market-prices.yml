name: market-prices

on:
  workflow_dispatch:          # lets you run it by hand from the Actions tab
  schedule:
    - cron: '30 2 * * *'      # 09:00 MMT
    - cron: '30 7 * * *'      # 14:00 MMT

permissions:
  contents: write             # required to commit data back to the repo

env:
  TG_CHANNEL: ${{ secrets.TG_CHANNEL }}
  DATA_DIR: docs/data
  PUBLIC_MODE: '1'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch prices
        run: python fetch_prices.py

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "data: prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
