<style>
  :root{
    --lacquer:#1b1410;
    --lacquer-2:#241a14;
    --gold:#d2a24c;
    --gold-dim:#8a6c34;
    --parchment:#ece2cf;
    --muted:#a3937c;
    --bull:#6fae7e;
    --bear:#cf6a58;
    --watch:#c9b06a;
    --exch:#8fb0a0;
    --line:rgba(210,162,76,.28);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--lacquer);color:var(--parchment);
    font-family:"Noto Sans Myanmar",system-ui,sans-serif;
    font-size:15px;line-height:1.6;
    background-image:radial-gradient(ellipse 90% 40% at 50% -8%,rgba(210,162,76,.08),transparent);
  }
  .wrap{max-width:1240px;margin:0 auto;padding:26px 18px 60px}

  header{text-align:center;padding:6px 0 18px;border-bottom:1px solid var(--line)}
  .rule{width:120px;height:1px;background:var(--gold-dim);margin:9px auto;position:relative}
  .rule::after{content:"◆";color:var(--gold);font-size:8px;position:absolute;left:50%;top:-7px;transform:translateX(-50%)}
  h1{font-family:Fraunces,serif;font-weight:700;font-size:30px;letter-spacing:.5px;margin:4px 0 0;color:var(--gold)}
  .sub{margin:2px 0 0;font-size:15.5px;font-weight:500}
  .updated{color:var(--muted);font-size:12.5px;margin-top:8px}

  .tabs{display:flex;gap:8px;margin:16px 0 22px;border-bottom:1px solid var(--line)}
  .tab{flex:1;max-width:220px;background:none;border:0;border-bottom:2px solid transparent;
       color:var(--muted);font:inherit;font-size:14px;padding:9px 4px;cursor:pointer}
  .tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}
  .tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
  .panel[hidden]{display:none}

  .tier{display:inline-block;padding:1px 8px;border-radius:99px;
        font-size:10.5px;border:1px solid;vertical-align:middle;white-space:nowrap}
  .tier.official {color:var(--gold);  border-color:var(--gold)}
  .tier.exchange {color:var(--exch);  border-color:var(--exch)}
  .tier.community{color:var(--watch); border-color:var(--watch)}

  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
  @media (max-width:900px){ .cols{grid-template-columns:1fr} }

  .col{background:var(--lacquer-2);border:1px solid rgba(210,162,76,.16);
       border-radius:8px;padding:14px 14px 12px}
  .col-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
            padding-bottom:8px;margin-bottom:10px;border-bottom:1px solid rgba(210,162,76,.16)}
  .col-head h2{font-size:14px;margin:0;font-weight:700}
  .col-note{font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.55}

  .sect{font-size:11.5px;color:var(--muted);margin:12px 0 6px;letter-spacing:.3px}
  .sect:first-of-type{margin-top:0}

  .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
       padding:5px 0;border-bottom:1px solid rgba(210,162,76,.08);font-size:13px}
  .row:last-child{border-bottom:0}
  .row .nm{color:var(--parchment);font-weight:500}
  .row .nm small{display:block;color:var(--muted);font-size:10.5px;font-weight:400;line-height:1.3}
  .row .vl{text-align:right;white-space:nowrap}
  .row .vl b{font-weight:700}
  .row .vl i{font-style:normal;font-size:11px;margin-left:5px}
  .row .vl .gap{display:block;font-size:10.5px;color:var(--gold);margin-top:1px}
  .up{color:var(--bull)} .dn{color:var(--bear)} .flat{color:var(--muted)}

  .big{display:flex;justify-content:space-between;align-items:baseline;
       padding:6px 0 10px;margin-bottom:4px;border-bottom:1px solid rgba(210,162,76,.16)}
  .big .lab{font-size:12px;color:var(--muted)}
  .big .val{font-size:22px;font-weight:700}
  .big .val i{font-style:normal;font-size:12px;margin-left:6px}

  .spread{margin-top:10px;padding:9px 10px;border:1px solid var(--gold-dim);
          border-radius:6px;text-align:center;font-size:12px;line-height:1.5}
  .spread b{font-size:17px;color:var(--gold);display:block}

  .ranges{display:flex;gap:6px;justify-content:center;margin:24px 0 14px}
  .range{background:none;border:1px solid var(--line);border-radius:99px;color:var(--muted);
         font:inherit;font-size:11.5px;padding:3px 12px;cursor:pointer}
  .range.on{color:var(--gold);border-color:var(--gold)}
  .charts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (max-width:760px){ .charts{grid-template-columns:1fr} }
  .chart{background:var(--lacquer-2);border:1px solid rgba(210,162,76,.16);
         border-radius:8px;padding:12px 12px 8px}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .chart-title{font-size:13px;font-weight:700}
  .chart-now{font-size:13.5px;font-weight:700;white-space:nowrap}
  .chart-chg{font-size:11.5px;margin-left:5px}
  .chart svg{display:block;width:100%;height:auto;margin-top:5px}
  .chart-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:4px}
  .chart-legend i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:4px}
  .chart-foot{font-size:10.5px;color:var(--muted);margin-top:3px}

  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 18px}
  @media (max-width:760px){ .board{grid-template-columns:repeat(3,1fr)} }
  .cell{background:var(--lacquer-2);border:1px solid var(--line);border-radius:6px;
        padding:10px 6px;text-align:center;cursor:pointer;color:var(--parchment);
        font:inherit;font-size:12.5px;transition:border-color .15s}
  .cell:hover{border-color:var(--gold)}
  .cell.active{border-color:var(--gold);background:#2c2016}
  .cell .em{font-size:18px;display:block}
  .cell .dir{display:block;font-weight:700;font-size:12.5px;margin-top:2px}
  .dir.bullish{color:var(--bull)} .dir.bearish{color:var(--bear)}
  .dir.neutral{color:var(--watch)} .dir.none{color:var(--muted);font-weight:400}
  .card{background:var(--lacquer-2);border:1px solid rgba(210,162,76,.16);
        border-left:3px solid var(--gold-dim);border-radius:6px;padding:13px 15px;margin-bottom:11px}
  .card time{color:var(--muted);font-size:12px}
  .badges{margin:6px 0 4px;display:flex;flex-wrap:wrap;gap:6px}
  .badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;border:1px solid}
  .badge.bullish{color:var(--bull);border-color:var(--bull)}
  .badge.bearish{color:var(--bear);border-color:var(--bear)}
  .badge.neutral{color:var(--watch);border-color:var(--watch)}
  .badge.none{color:var(--muted);border-color:rgba(163,147,124,.5);font-weight:500}
  .headline{font-weight:500;font-size:15px;margin:4px 0 2px}
  .headline a{color:var(--parchment);text-decoration:none;border-bottom:1px dotted var(--gold-dim)}
  .headline a:hover{color:var(--gold)}
  .src{color:var(--gold-dim);font-size:11.5px;margin-left:8px}
  .why{color:var(--muted);font-size:12.5px;margin:0}
  .toggle{display:block;margin:0 auto 16px;background:none;border:1px solid var(--line);
          border-radius:99px;color:var(--muted);font:inherit;font-size:12.5px;padding:5px 16px;cursor:pointer}
  .toggle.on{color:var(--gold);border-color:var(--gold)}

  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}
  footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
         color:var(--muted);font-size:12px;text-align:center;line-height:1.7}
</style>

<script>
function esc(t){ const d=document.createElement("div"); d.textContent=t||""; return d.innerHTML; }
function fmt(n,dp){
  if (typeof n!=="number" || !isFinite(n)) return null;
  return n.toLocaleString("en-US", dp!=null?{minimumFractionDigits:dp,maximumFractionDigits:dp}:{});
}
function timeAgo(iso){
  const m = Math.round((Date.now()-new Date(iso))/60000);
  if (m<60) return m+" မိနစ်အကြာ";
  if (m<1440) return Math.round(m/60)+" နာရီအကြာ";
  return Math.round(m/1440)+" ရက်အကြာ";
}
function chgCls(v){ return v>0.005?"up":(v<-0.005?"dn":"flat"); }
function chgArrow(v){ return v>0.005?"▲":(v<-0.005?"▼":"—"); }

const TIERS = {
  official:{my:"တရားဝင် (ဗဟိုဘဏ်)",cls:"official"},
  exchange:{my:"စတော့အိတ်ချိန်း",cls:"exchange"},
  community:{my:"လူမှုကွန်ရက်",cls:"community"}
};

document.getElementById("tab-market").onclick = () => switchTab("market");
document.getElementById("tab-news").onclick   = () => switchTab("news");
function switchTab(w){
  for (const k of ["market","news"]){
    const on = k===w, t = document.getElementById("tab-"+k);
    t.classList.toggle("on",on); t.setAttribute("aria-selected",on?"true":"false");
    document.getElementById("panel-"+k).hidden = !on;
  }
}

let SERIES=null, MARKET=null, STREET=null, RANGE=90;
const RANGES=[[30,"၃၀ ရက်"],[90,"၉၀ ရက်"],[365,"၁ နှစ်"],[0,"အားလုံး"]];

/* ========================== column 1: YSX ======================= */
function renderYsx(){
  const box = document.getElementById("col-ysx");
  const ysx = MARKET && MARKET.ysx, st = MARKET && MARKET.stocks;
  if (!(ysx && ysx.status==="ok") && !(st && st.status==="ok")){
    box.innerHTML = '<p class="empty">စတော့ဈေးကွက် ဒေတာ မရရှိပါ</p>'; return;
  }
  let h = `<div class="col-head"><h2>ရန်ကုန်စတော့အိတ်ချိန်း</h2>
           <span class="tier exchange">${TIERS.exchange.my}</span></div>`;

  if (ysx && ysx.status==="ok"){
    const c = chgCls(ysx.change_pct||0);
    h += `<div class="big"><span class="lab">MYANPIX</span>
      <span class="val">${fmt(ysx.close,2)}
        <i class="${c}">${chgArrow(ysx.change_pct||0)} ${Math.abs(ysx.change_pct||0).toFixed(2)}%</i>
      </span></div>`;
  }

  if (st && st.status==="ok" && st.stocks.length){
    h += `<div class="sect">ကုမ္ပဏီ ${st.stocks.length} ခု · ပိတ်ဈေး (ကျပ်)</div>`;
    for (const s of st.stocks){
      const c = chgCls(s.change_pct||0);
      h += `<div class="row">
        <span class="nm">${esc(s.code)}<small>${esc(s.name)}</small></span>
        <span class="vl"><b>${fmt(s.close)}</b>
          <i class="${c}">${chgArrow(s.change_pct||0)} ${Math.abs(s.change_pct||0).toFixed(2)}%</i></span>
      </div>`;
    }
    if (st.as_of) h += `<p class="col-note">ရက်စွဲ — ${esc(st.as_of)}</p>`;
  }
  box.innerHTML = h;
}

/* ======================= column 2: street ======================= */
function renderStreet(){
  const box = document.getElementById("col-street");
  if (!STREET || !STREET.values){
    box.innerHTML = '<p class="empty">လမ်းဘေးဈေး မရရှိပါ</p>'; return;
  }
  const v = STREET.values, g = v.gold||{}, fx = v.fx||{}, fu = v.fuel||{};
  const L = STREET.labels||{};

  let h = `<div class="col-head"><h2>လမ်းဘေးဈေး</h2>
           <span class="tier community">${TIERS.community.my}</span></div>`;

  if (g.gold_16pe){
    h += `<div class="big"><span class="lab">${esc((L.gold_16pe&&L.gold_16pe.my)||"၁၆ ပဲရည်")}</span>
          <span class="val">${fmt(g.gold_16pe)}</span></div>`;
  }
  if (g.gold_15pe){
    h += `<div class="row"><span class="nm">${esc((L.gold_15pe&&L.gold_15pe.my)||"၁၅ ပဲရည်")}
          <small>ကျပ်/ကျပ်သား</small></span>
          <span class="vl"><b>${fmt(g.gold_15pe)}</b></span></div>`;
  }

  const fxRows = [["USD","ဒေါ်လာ"],["THB","ဘတ်"],["CNY","ယွမ်"],["SGD","စင်္ကာပူဒေါ်လာ"]]
    .filter(([c]) => fx[c]);
  if (fxRows.length){
    h += `<div class="sect">ငွေလဲနှုန်း (ကျပ်)</div>`;
    for (const [c,my] of fxRows)
      h += `<div class="row"><span class="nm">${esc(my)}<small>${c}</small></span>
            <span class="vl"><b>${fmt(fx[c])}</b></span></div>`;
  }

  const fuRows = [["YGN_92","ရန်ကုန် ၉၂"],["YGN_95","ရန်ကုန် ၉၅"],
                  ["MDY_92","မန္တလေး ၉၂"],["MDY_95","မန္တလေး ၉၅"]].filter(([k])=>fu[k]);
  if (fuRows.length){
    h += `<div class="sect">စက်သုံးဆီ (ကျပ်/လီတာ)</div>`;
    for (const [k,my] of fuRows)
      h += `<div class="row"><span class="nm">${esc(my)}</span>
            <span class="vl"><b>${fmt(fu[k])}</b></span></div>`;
  }

  h += `<p class="col-note">`+
       (STREET.post_date ? `ရက်စွဲ — ${esc(STREET.post_date)}` : "")+
       (STREET.status==="stale" ? " · ဟောင်းနေပါပြီ" : "")+
       (STREET.source_disclaimer_my ? `<br>${esc(STREET.source_disclaimer_my)}` : "")+
       `</p>`;
  box.innerHTML = h;
}

/* ====================== column 3: official ======================
   The official rate is the headline figure here -- an earlier version
   showed the street rate in bold under a heading that said "official",
   which contradicted itself. The gap is labelled ကွာဟ and coloured gold
   rather than green: a 111% divergence is not a gain, it is a spread. */
function renderOfficial(){
  const box = document.getElementById("col-official");
  const cbm = MARKET && MARKET.cbm;
  if (!(cbm && cbm.status==="ok")){
    box.innerHTML = '<p class="empty">တရားဝင်နှုန်း မရရှိပါ</p>'; return;
  }
  const r = cbm.rates||{}, d = (MARKET.derived||{}).fx_premium||{};

  let h = `<div class="col-head"><h2>တရားဝင်နှုန်း</h2>
           <span class="tier official">${TIERS.official.my}</span></div>`;

  if (r.USD){
    const p = d.USD;
    h += `<div class="big"><span class="lab">ဒေါ်လာ (USD)</span>
          <span class="val">${fmt(r.USD)}</span></div>`;
    if (p) h += `<p class="col-note" style="margin:0 0 6px">
                 လမ်းဘေးဈေး ${fmt(p.street)} · ကွာဟ ${p.premium_pct}%</p>`;
  }

  h += `<div class="sect">တရားဝင်နှုန်း (ကျပ်)</div>`;
  const names = {USD:"ဒေါ်လာ",THB:"ဘတ်",CNY:"ယွမ်",SGD:"စင်္ကာပူဒေါ်လာ"};
  let any = false;
  for (const c of ["USD","THB","CNY","SGD"]){
    if (!r[c]) continue;
    any = true;
    const p = d[c];
    h += `<div class="row">
      <span class="nm">${esc(names[c])}<small>${c}${p?` · လမ်းဘေး ${fmt(p.street)}`:""}</small></span>
      <span class="vl"><b>${fmt(r[c])}</b>
        ${p?`<span class="gap">ကွာဟ ${p.premium_pct}%</span>`:""}</span></div>`;
  }
  if (!any) h += `<p class="empty">—</p>`;

  const s = (MARKET.derived||{}).fx_spread;
  if (s){
    h += `<div class="spread"><b>${s.premium_pct}%</b>
          လမ်းဘေးဒေါ်လာဈေးသည် ဗဟိုဘဏ် တရားဝင်နှုန်းထက် မြင့်နေသည်</div>`;
  }

  h += `<p class="col-note">`+
       (cbm.as_of ? `ရက်စွဲ — ${esc(cbm.as_of)}<br>` : "")+
       `မြန်မာ့ရွှေအတွက် တရားဝင် ဒေတာရင်းမြစ် မရှိပါ။`+
       `</p>`;
  box.innerHTML = h;
}

/* ============================ charts ============================ */
function cutoff(days){
  if (!days) return "0000-00-00";
  return new Date(Date.now()-days*86400000).toISOString().slice(0,10);
}
function pick(rows,key,days){
  const lo = cutoff(days), out = [];
  for (const r of rows||[]){
    if (!r.date || r.date < lo) continue;
    const v = r[key];
    if (typeof v==="number" && isFinite(v)) out.push({d:r.date,v:v});
  }
  return out;
}

function chart(title,tier,unit,lines,note){
  const all = lines.flatMap(l=>l.pts);
  if (all.length < 2) return "";
  const W=300,H=76,PL=3,PR=3,PT=6,PB=6;
  const dates=[...new Set(all.map(p=>p.d))].sort();
  const xOf=d=>PL+(dates.indexOf(d)/Math.max(1,dates.length-1))*(W-PL-PR);
  let lo=Math.min(...all.map(p=>p.v)), hi=Math.max(...all.map(p=>p.v));
  if (lo===hi){lo-=1;hi+=1;}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const yOf=v=>PT+(1-(v-lo)/(hi-lo))*(H-PT-PB);

  const paths = lines.map(l=>{
    if (l.pts.length<2) return "";
    const d=l.pts.map((p,i)=>(i?"L":"M")+xOf(p.d).toFixed(1)+" "+yOf(p.v).toFixed(1)).join(" ");
    return `<path d="${d}" fill="none" stroke="${l.color}" stroke-width="1.5"
             stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join("");

  const main=lines[0].pts, f=main[0].v, last=main[main.length-1].v;
  const chg=f?((last-f)/f*100):0;

  const legend = lines.length>1
    ? `<div class="chart-legend">`+lines.filter(l=>l.pts.length).map(l=>
        `<span><i style="background:${l.color}"></i>${esc(l.label)}</span>`).join("")+`</div>` : "";

  const t=TIERS[tier]||TIERS.community;
  return `<div class="chart">
    <div class="chart-head">
      <span class="chart-title">${esc(title)} <span class="tier ${t.cls}">${t.my}</span></span>
      <span class="chart-now">${fmt(Math.round(last*100)/100)}<span class="chart-chg ${chgCls(chg)}">${chgArrow(chg)} ${Math.abs(chg).toFixed(1)}%</span></span>
    </div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
         aria-label="${esc(title)}">${paths}</svg>
    ${legend}
    <div class="chart-foot">${esc(unit)} · ${main[0].d} → ${main[main.length-1].d}${note?" · "+esc(note):""}</div>
  </div>`;
}

function renderCharts(){
  const box=document.getElementById("charts");
  if (!SERIES){ box.innerHTML='<p class="empty">ဂရပ်ဒေတာ မရရှိသေးပါ</p>'; return; }
  const s=SERIES.street||[], mx=SERIES.myanpix||[], sk=SERIES.stocks||[];
  const out=[];

  out.push(chart("MYANPIX","exchange","အမှတ်",
    [{label:"MYANPIX",color:"#8fb0a0",pts:pick(mx,"close",RANGE)}]));

  out.push(chart("ရွှေ","community","ကျပ်/ကျပ်သား",[
    {label:"၁၆ ပဲရည်",color:"#d2a24c",pts:pick(s,"gold_16pe",RANGE)},
    {label:"၁၅ ပဲရည်",color:"#8a6c34",pts:pick(s,"gold_15pe",RANGE)}]));

  const cbmUsd = MARKET&&MARKET.cbm&&MARKET.cbm.rates ? MARKET.cbm.rates.USD : null;
  out.push(chart("ဒေါ်လာ (USD)","community","ကျပ်",
    [{label:"လမ်းဘေး",color:"#d2a24c",pts:pick(s,"USD",RANGE)}],
    cbmUsd?`တရားဝင် ${fmt(cbmUsd)}`:null));

  out.push(chart("ဘတ် (THB)","community","ကျပ်",
    [{label:"THB",color:"#d2a24c",pts:pick(s,"THB",RANGE)}]));

  out.push(chart("ယွမ် (CNY)","community","ကျပ်",
    [{label:"CNY",color:"#d2a24c",pts:pick(s,"CNY",RANGE)}]));

  out.push(chart("စက်သုံးဆီ","community","ကျပ်/လီတာ",[
    {label:"ရန်ကုန် ၉၂",color:"#d2a24c",pts:pick(s,"YGN_92",RANGE)},
    {label:"ရန်ကုန် ၉၅",color:"#cf6a58",pts:pick(s,"YGN_95",RANGE)},
    {label:"မန္တလေး ၉၂",color:"#6fae7e",pts:pick(s,"MDY_92",RANGE)},
    {label:"မန္တလေး ၉၅",color:"#8fb0a0",pts:pick(s,"MDY_95",RANGE)}]));

  const TK=["FMI","MTSH","MCB","FPB","TMH","EFR","AMATA","MAEX"];
  const CL=["#d2a24c","#8fb0a0","#cf6a58","#6fae7e","#c9b06a","#8a6c34","#a3937c","#ece2cf"];
  const stockLines = TK.map((t,i)=>({label:t,color:CL[i],pts:pick(sk,t,RANGE)}))
                       .filter(l=>l.pts.length>1);
  if (stockLines.length)
    out.push(chart("ကုမ္ပဏီ ပိတ်ဈေး","exchange","ကျပ်",stockLines));

  const html=out.filter(Boolean).join("");
  box.innerHTML = html || '<p class="empty">ဤကာလအတွင်း ဒေတာ မလုံလောက်ပါ</p>';
}

function renderRanges(){
  const r=document.getElementById("ranges");
  r.innerHTML=RANGES.map(([d,l])=>`<button class="range${d===RANGE?" on":""}" data-d="${d}">${l}</button>`).join("");
  r.querySelectorAll(".range").forEach(b=>{
    b.onclick=()=>{ RANGE=+b.dataset.d; renderRanges(); renderCharts(); };
  });
}

/* ============================= news ============================= */
const MARKETS={gold:["💰","ရွှေ"],fx_kyat:["💵","ကျပ်/ဒေါ်လာ"],rice:["🌾","ဆန်"],
               pulses:["🌱","ပဲ"],edible_oil:["🛢","စားသုံးဆီ"],fuel:["⛽","စက်သုံးဆီ"]};
const DIRS={bullish:"တက်ရိပ် ▲",bearish:"ကျရိပ် ▼",neutral:"စောင့်ကြည့် ◆",none:"—"};
let DATA=[],FILTER=null,SIGNALS_ONLY=false;

document.getElementById("toggle").onclick=()=>{SIGNALS_ONLY=!SIGNALS_ONLY;renderToggle();renderFeed();};
function renderToggle(){
  const t=document.getElementById("toggle");
  t.className="toggle"+(SIGNALS_ONLY?" on":"");
  t.textContent=SIGNALS_ONLY?"◆ အချက်ပြများသာ ပြထားသည် — အားလုံးပြရန် နှိပ်ပါ"
                            :"သတင်းအားလုံး ပြထားသည် — အချက်ပြများသာ ကြည့်ရန် နှိပ်ပါ";
}
function latestDir(mk){
  for (const s of DATA){ const h=s.markets.find(x=>x.market===mk&&x.direction!=="neutral"); if(h) return h.direction; }
  for (const s of DATA) if (s.markets.some(x=>x.market===mk)) return "neutral";
  return "none";
}
function renderBoard(){
  const b=document.getElementById("board"); b.innerHTML="";
  for (const [mk,[em,label]] of Object.entries(MARKETS)){
    const d=latestDir(mk), c=document.createElement("button");
    c.className="cell"+(FILTER===mk?" active":"");
    c.innerHTML=`<span class="em">${em}</span>${label}<span class="dir ${d}">${DIRS[d]}</span>`;
    c.onclick=()=>{FILTER=(FILTER===mk?null:mk);renderBoard();renderFeed();};
    b.appendChild(c);
  }
}
function renderFeed(){
  const f=document.getElementById("feed"); f.innerHTML="";
  let rows=DATA;
  if (SIGNALS_ONLY||FILTER) rows=rows.filter(s=>s.markets.length>0);
  if (FILTER) rows=rows.filter(s=>s.markets.some(m=>m.market===FILTER));
  if (!rows.length){ f.innerHTML='<p class="empty">ယခုအချိန်တွင် အချက်ပြမှု မရှိသေးပါ။</p>'; return; }
  for (const s of rows.slice(0,120)){
    const card=document.createElement("article"); card.className="card";
    const badges=s.markets.length
      ? s.markets.map(m=>{const [em,label]=MARKETS[m.market]||["•",m.market];
          return `<span class="badge ${m.direction}">${em} ${label} ${DIRS[m.direction]} ${Math.round(m.confidence*100)}%</span>`;}).join("")
      : `<span class="badge none">➖ ဈေးကွက်သက်ရောက်မှု မတွေ့ပါ</span>`;
    const why=s.markets.map(m=>m.rationale).filter(Boolean).join(" · ");
    const u=(s.url&&/^https?:\/\//.test(s.url))?s.url:null;
    const t=u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a>`:esc(s.title);
    card.innerHTML=`<time datetime="${s.ts}">${timeAgo(s.ts)}</time>`+
      (s.source?`<span class="src">${esc(s.source)}</span>`:"")+
      `<div class="badges">${badges}</div><p class="headline">${t}</p><p class="why">${esc(why)}</p>`;
    f.appendChild(card);
  }
}

/* ============================= load ============================= */
const vq="?v="+Date.now();
Promise.allSettled([

]).then(([p,m,s])=>{

  MARKET = m.status==="fulfilled"?m.value:null;
  SERIES = s.status==="fulfilled"?s.value:null;
  renderYsx(); renderStreet(); renderOfficial();
  renderRanges(); renderCharts();
});

fetch("data/signals.json"+vq).then(r=>r.json())
  .then(j=>{
    DATA=j.signals||[];
    document.getElementById("updated").textContent =
      j.generated_at ? "နောက်ဆုံးစစ်ဆေးချိန် — "+timeAgo(j.generated_at)
                     : "စတင်လည်ပတ်ရန် ပြင်ဆင်နေဆဲ";
    renderToggle(); renderBoard(); renderFeed();
  })
  .catch(()=>{
    document.getElementById("updated").textContent="ဒေတာ မရရှိသေးပါ";
    renderToggle(); renderBoard(); renderFeed();
  });
